<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой AI Сервис</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .form-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Связаться со мной</h2>
    <form action="https://api.web3forms.com/submit" method="POST">

        <!-- Ваш скопированный ключ Web3Forms -->
        <input type="hidden" name="access_key" value="941700a8-0b93-4c72-84e8-248bf0bffede">

        <!-- Заголовок письма -->
        <input type="hidden" name="subject" value="Новая заявка с сайта!">

        <div class="form-group">
            <label for="name">Ваше имя:</label>
            <input type="text" name="name" id="name" required placeholder="Иван">
        </div>

        <div class="form-group">
            <label for="email">Ваш Email:</label>
            <input type="email" name="email" id="email" required placeholder="example@mail.com">
        </div>

        <div class="form-group">
            <label for="message">Сообщение:</label>
            <textarea name="message" id="message" required placeholder="Опишите вашу задачу..."></textarea>
        </div>

        <button type="submit">Отправить заявку</button>
    </form>
</div>

</body>
</html>
